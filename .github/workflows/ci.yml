# Save this file as .github/workflows/ci.yml in BOTH research repositories.
#
# What it buys you: a green check mark on your repository page proving the code
# installs cleanly from a fresh environment on someone else's machine. That is
# the difference between claiming reproducibility and demonstrating it, and it
# is the specific claim a reviewer is most sceptical of.
#
# Start with install-and-import only. Add real tests as you write them. A CI
# file that fails is worse than no CI file, so keep this passing.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  install:
    name: Install and import on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install package
        run: pip install -e .

      - name: Verify the package imports
        run: |
          python -c "import wcf_biofilm; print('package imports cleanly')"

      - name: Run tests if any exist
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest -v
          else
            echo "No tests/ directory yet. Skipping."
          fi
